<main id="main"><div class="wrap">
<section class="page-head">
  <h1>امتحان تجريبي</h1>
  <p class="lead">اختر الموضوع، شغّل المؤقت، وحلّ على الورق. لا تفتح الحل قبل أن ينتهي الوقت.</p>
</section>

<section style="max-width:560px">
  <div class="form-grid">
    <div class="field"><label for="yr">الموضوع</label>
      <select id="yr"><option>2026</option><option>2025</option><option>2024</option><option>2023</option><option>2022</option><option>2021</option></select></div>
    <div class="field"><label for="dur">المدة</label>
      <select id="dur"><option value="150" selected>2 س 30 د (كامل)</option><option value="90">90 د (نص + أسئلة)</option><option value="60">60 د (أسئلة فقط)</option></select></div>
  </div>
  <p><a id="openExam" class="btn ghost" href="annales/2026.html" target="_blank" rel="noopener">افتح الموضوع في تبويب جديد</a></p>

  <div class="clock" id="clock" role="timer" aria-live="off">02:30:00</div>
  <p class="center" id="nowPhase" style="font-weight:700;min-height:1.6em"></p>
  <div class="row" style="justify-content:center">
    <button class="btn big-start" id="go" type="button" style="justify-content:center">ابدأ</button>
  </div>
  <div class="row mt1" style="justify-content:center">
    <button class="btn ghost sm" id="pause" type="button" disabled>إيقاف مؤقت</button>
    <button class="btn ghost sm" id="stop" type="button" disabled>إنهاء</button>
  </div>
  <details class="mt1"><summary>توزيع الوقت المقترح</summary><div class="phases" id="phases" aria-label="مراحل مقترحة"></div></details>
</section>

<details class="mt2" id="selfEval" style="max-width:560px">
  <summary>بعد التصحيح: سجّل نتيجتك</summary>
  <div class="form-grid">
    <div class="field"><label for="sComp">فهم النص (من 14)</label><input id="sComp" type="number" min="0" max="14" step="0.25"></div>
    <div class="field"><label for="sProd">الإنتاج الكتابي (من 6)</label><input id="sProd" type="number" min="0" max="6" step="0.25"></div>
    <div class="field"><label for="sSujet">الموضوع الذي اخترته</label>
      <select id="sSujet"><option value="1">الأول</option><option value="2">الثاني</option></select></div>
    <div class="field"><label for="sType">نوع الإنتاج</label>
      <select id="sType"><option value="cr">Compte rendu</option><option value="libre">Production libre</option></select></div>
  </div>
  <div class="field"><label for="sNote">ما الذي سأغيّره في المرة القادمة؟</label><input id="sNote" type="text" style="direction:rtl"></div>
  <div class="row"><div class="score-big" id="total" style="margin:0">— / 20</div><span class="spacer"></span><button class="btn" id="saveEval" type="button">حفظ النتيجة</button></div>
</details>

</div></main>
