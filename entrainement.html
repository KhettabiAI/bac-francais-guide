<main id="main"><div class="wrap">
<section class="page-head">
  <h1>أسئلة سريعة</h1>
  <p class="lead">أسئلة حقيقية من مواضيع 2021–2026. أجب، ثم اقرأ التفسير. ما أخطأت فيه يُسجَّل لتراجعه لاحقاً.</p>
</section>

<section id="setup" style="max-width:560px">
  <button class="btn big-start" id="startBtn" type="button">ابدأ 10 أسئلة مختلطة</button>
  <p class="hint" id="poolInfo"></p>
  <details>
    <summary>اختر نوعاً أو سنة</summary>
    <div class="field">
      <label>نوع السؤال</label>
      <div class="row" id="skillChips" role="group" aria-label="أنواع الأسئلة"></div>
    </div>
    <div class="form-grid">
      <div class="field"><label for="yearSel">السنة</label>
        <select id="yearSel"><option value="all">كل السنوات</option><option>2026</option><option>2025</option><option>2024</option><option>2023</option><option>2022</option><option>2021</option></select></div>
      <div class="field"><label for="countSel">عدد الأسئلة</label>
        <select id="countSel"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>
    </div>
  </details>
  <span class="hint" id="statsInfo"></span>
</section>

<section id="runner" hidden aria-live="polite" style="max-width:640px">
  <div class="row"><strong id="qCount"></strong><span class="spacer"></span><span class="muted" id="qScore"></span></div>
  <div class="progress mt1"><span id="qBar"></span></div>
  <article class="card q-card mt1" id="qCard"></article>
</section>

<section id="result" hidden style="max-width:560px">
  <div class="card center">
    <div class="score-big" id="rScore"></div>
    <p id="rMsg"></p>
    <div class="row" style="justify-content:center" id="rActions"><button class="btn" id="againBtn" type="button">جلسة جديدة</button></div>
  </div>
  <div id="bySkill" class="mt1"></div>
</section>
